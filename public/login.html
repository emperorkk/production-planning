<!doctype html>
<html lang="el" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script src="/src/theme.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/pm-32.png" />
  <link rel="apple-touch-icon" href="/icons/pm-apple-180.png" />
  <link rel="manifest" href="/production.webmanifest" />
  <title>Σύνδεση — Παραγωγή Vlachos Bros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/production.css" />
  <style>
    body { display: grid; place-items: center; padding: 24px 16px; padding-top: max(24px, env(safe-area-inset-top));
      background:
        radial-gradient(900px 500px at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
        radial-gradient(700px 400px at 100% 100%, color-mix(in srgb, var(--text) 6%, transparent), transparent 60%),
        var(--bg); }
    .login { width: 100%; max-width: 400px; }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .login-brand img { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 0 0 1px var(--border), var(--shadow); }
    .login-brand .t { font-size: 20px; font-weight: 700; letter-spacing: -.025em; }
    .login-brand .s { font-size: 12.5px; color: var(--muted); }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px; box-shadow: var(--shadow-lg); }
    .login-card h1 { font-size: 17px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 4px; }
    .login-card .lead { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
    .f { margin-bottom: 14px; }
    .f label, .f .lbl { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    details { margin-bottom: 14px; }
    summary { font-size: 12.5px; color: var(--muted); cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '›'; display: inline-block; transition: transform .15s; }
    details[open] summary::before { transform: rotate(90deg); }
    details[open] summary { margin-bottom: 10px; }
    .access { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .access label { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 11px 12px; border: 1px solid var(--border-strong); border-radius: 12px;
      cursor: pointer; background: var(--surface); transition: border-color .15s, box-shadow .15s; margin: 0; }
    .access input { position: absolute; opacity: 0; pointer-events: none; }
    .access .a-t { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .access .a-s { font-size: 11.5px; color: var(--muted); }
    .access label:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .access label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .submit { width: 100%; height: 44px; justify-content: center; margin-top: 6px; font-size: 14.5px; }
    .error { display: none; margin-top: 12px; }
    .error.visible { display: block; }
    .login-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); padding: 0 4px; }
    .login-foot .seg button { height: 28px; font-size: 12px; padding: 0 9px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="login-brand">
      <img src="/icons/pm-mark-64.png" alt="" />
      <div><div class="t">Παραγωγή</div><div class="s">ΑΦΟΙ ΒΛΑΧΟΥ Α.Β.Ε.Ε.</div></div>
    </div>

    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Σύνδεση</h1>
      <p class="lead">Με τον λογαριασμό Soft1 Web Account</p>

      <div class="f"><label for="username">Χρήστης</label>
        <input id="username" name="username" class="input" type="text" required autocomplete="username" autofocus /></div>
      <div class="f"><label for="password">Κωδικός</label>
        <input id="password" name="password" class="input" type="password" required autocomplete="current-password" /></div>

      <div class="f"><span class="lbl" id="access-lbl">Πρόσβαση</span>
        <div class="access" role="radiogroup" aria-labelledby="access-lbl">
          <label><input type="radio" name="access" value="full" /><span class="a-t">Πλήρης</span><span class="a-s">Προγραμματισμός + Διαχείριση</span></label>
          <label><input type="radio" name="access" value="production" /><span class="a-t">Διαχείριση</span><span class="a-s">Μόνο διαχείριση παραγωγής</span></label>
        </div>
      </div>

      <details>
        <summary>Εταιρία / υποκατάστημα</summary>
        <div class="row2">
          <div><label class="lbl" for="company" style="font-size:12.5px;color:var(--text-2);display:block;margin-bottom:6px">Εταιρία</label>
            <input id="company" name="company" class="input" type="number" placeholder="προαιρετικό" autocomplete="off" /></div>
          <div><label class="lbl" for="branch" style="font-size:12.5px;color:var(--text-2);display:block;margin-bottom:6px">Υποκ/μα</label>
            <input id="branch" name="branch" class="input" type="number" placeholder="προαιρετικό" autocomplete="off" /></div>
        </div>
      </details>

      <button id="btn-login" class="btn brand submit" type="submit">Σύνδεση</button>
      <div id="error" class="error" role="alert"></div>
    </form>

    <div class="login-foot">
      <span data-app-version></span>
      <div class="seg" role="radiogroup" aria-label="Θέμα" id="theme-seg">
        <button type="button" role="radio" data-theme-set="system">Σύστημα</button>
        <button type="button" role="radio" data-theme-set="light">Φωτεινό</button>
        <button type="button" role="radio" data-theme-set="dark">Σκούρο</button>
      </div>
    </div>
  </main>

  <script src="/src/login.js" defer></script>
  <script src="/src/version.js"></script>
  <script>
    (function () {
      var seg = document.getElementById('theme-seg');
      function paint() {
        seg.querySelectorAll('button').forEach(function (b) {
          var on = b.getAttribute('data-theme-set') === Theme.get();
          b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
        });
      }
      paint(); window.addEventListener('themechange', paint);
      seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) Theme.set(b.getAttribute('data-theme-set')); });
    })();
  </script>
</body>
</html>
