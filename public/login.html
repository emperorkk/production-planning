<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Σύνδεση — Πρόγραμμα Παραγωγής</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbe8ff 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 110%, #ffe8e0 0%, transparent 60%),
        #f4f5f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(10, 20, 50, 0.12);
      overflow: hidden;
    }
    .card-header {
      padding: 20px 24px 16px;
      background: linear-gradient(135deg, #2c3e50, #34495e);
      color: #fff;
    }
    .card-header h1 { font-size: 18px; font-weight: 600; }
    .card-header p  { font-size: 12px; opacity: .8; margin-top: 4px; }
    .card-body { padding: 24px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 4px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus { outline: 2px solid #2c3e50; outline-offset: -1px; border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: none;
      border-radius: 5px;
      background: #2c3e50;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1e2d3d; }
    button:disabled { opacity: .5; cursor: wait; }
    .error {
      margin-top: 14px;
      padding: 10px;
      background: #fde2e2;
      color: #c0392b;
      border: 1px solid #f5b7b1;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .error.visible { display: block; }
    .footer {
      text-align: center;
      padding: 12px;
      background: #f8f9fa;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <form id="login-form" class="card" autocomplete="on">
    <div class="card-header">
      <h1>Πρόγραμμα Παραγωγής</h1>
      <div class="app-version" data-app-version style="text-align:center;font-size:11px;color:#888;margin:-6px 0 10px;"></div>
      <p>Σύνδεση με Soft1 Web Account</p>
    </div>
    <div class="card-body">
      <label for="username">Χρήστης</label>
      <input id="username" name="username" type="text" required autocomplete="username" autofocus />

      <label for="password">Κωδικός</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <div class="row">
        <div>
          <label for="company">Εταιρία</label>
          <input id="company" name="company" type="number" placeholder="προαιρετικό" autocomplete="off" />
        </div>
        <div>
          <label for="branch">Υποκ/μα</label>
          <input id="branch" name="branch" type="number" placeholder="προαιρετικό" autocomplete="off" />
        </div>
      </div>

      <button id="btn-login" type="submit">Σύνδεση</button>
      <div id="error" class="error"></div>
    </div>
    <div class="footer">Vlachos Bros — Production Planner</div>
  </form>

  <script src="src/login.js" defer></script>
  <script src="/src/version.js"></script>
</body>
</html>
