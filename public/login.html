<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2c3e50" />
  <title>Σύνδεση — Vlachos Bros Παραγωγή</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(90deg, #ee1c25 0 50%, #111 50% 100%);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(10, 20, 50, 0.12);
      overflow: hidden;
    }
    .card-header {
      padding: 20px 24px 16px;
      background: #111;
      color: #fff;
      border-bottom: 4px solid #ee1c25;
      display: flex; gap: 16px; align-items: center;
    }
    .card-header .logo { width: 64px; height: auto; background: #fff; padding: 4px; border-radius: 6px; flex-shrink: 0; }
    .card-header h1 { font-family: 'Comfortaa', inherit; font-size: 18px; font-weight: 700; }
    .card-header p  { font-size: 12px; opacity: .8; margin-top: 4px; }
    .card-body { padding: 24px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 4px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus { outline: 2px solid #ee1c25; outline-offset: -1px; border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: none;
      border-radius: 5px;
      background: #ee1c25;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #be161e; }
    button:disabled { opacity: .5; cursor: wait; }
    .error {
      margin-top: 14px;
      padding: 10px;
      background: #fde2e2;
      color: #c0392b;
      border: 1px solid #f5b7b1;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .error.visible { display: block; }
    .access { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid #d1d5db; border-radius: 5px; overflow: hidden; }
    .access label { margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 9px 6px;
      font-size: 12px; text-transform: none; letter-spacing: 0; color: #333; cursor: pointer; background: #fff; line-height: 1.25; }
    .access label + label { border-left: 1px solid #d1d5db; }
    .access input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .access input:checked + span { font-weight: 700; }
    .access label:has(input:checked) { background: #111; color: #fff; }
    .access label:has(input:focus-visible) { outline: 2px solid #ee1c25; outline-offset: -2px; }
    .footer {
      text-align: center;
      padding: 12px;
      background: #f8f9fa;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <form id="login-form" class="card" autocomplete="on">
    <div class="card-header">
      <img class="logo" src="/icons/vb-logo.png" alt="Vlachos Bros" width="64" />
      <div>
        <h1>Παραγωγή</h1>
        <div class="app-version" data-app-version style="font-size:11px;opacity:.6;margin:2px 0 6px;"></div>
        <p>Σύνδεση με Soft1 Web Account</p>
      </div>
    </div>
    <div class="card-body">
      <label for="username">Χρήστης</label>
      <input id="username" name="username" type="text" required autocomplete="username" autofocus />

      <label for="password">Κωδικός</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <div class="row">
        <div>
          <label for="company">Εταιρία</label>
          <input id="company" name="company" type="number" placeholder="προαιρετικό" autocomplete="off" />
        </div>
        <div>
          <label for="branch">Υποκ/μα</label>
          <input id="branch" name="branch" type="number" placeholder="προαιρετικό" autocomplete="off" />
        </div>
      </div>

      <label style="margin-top:14px">Πρόσβαση</label>
      <div class="access" role="radiogroup" aria-label="Πρόσβαση">
        <label><input type="radio" name="access" value="full" /><span>Προγραμματισμός<br/>+ Διαχείριση</span></label>
        <label><input type="radio" name="access" value="production" /><span>Διαχείριση<br/>παραγωγής</span></label>
      </div>

      <button id="btn-login" type="submit">Σύνδεση</button>
      <div id="error" class="error"></div>
    </div>
    <div class="footer">ΑΦΟΙ ΒΛΑΧΟΥ Α.Β.Ε.Ε. — Προγραμματισμός &amp; Διαχείριση παραγωγής</div>
  </form>

  <script src="/src/login.js" defer></script>
  <script src="/src/version.js"></script>
</body>
</html>
